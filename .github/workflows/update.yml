name: Update COE data

on:
  schedule:
    # Bidding-day burst: every 10 min, 15:50–18:00 SGT (07:50-10:00 UTC), Wednesdays.
    # The script only produces new data when LTA has published, so off-week Wednesdays are no-ops.
    - cron: "50 7 * * 3"
    - cron: "*/10 8-9 * * 3"
    # Nightly safety run, 2am SGT (18:00 UTC previous day) — same slot as resaleshdb.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest COE results
        run: python scripts/fetch_coe.py
      - name: Commit if changed
        run: |
          git config user.name "coetoday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "COE data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
# Netlify: link this repo, publish directory = repo root, no build command.
# Every data commit triggers an instant redeploy — same pattern as resaleshdb.

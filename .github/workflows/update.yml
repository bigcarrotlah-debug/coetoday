name: Update COE data

on:
  schedule:
    # Bidding-day burst: every 10 min, 15:50-19:00 SGT (07:50-11:00 UTC), Wednesdays.
    - cron: "50 7 * * 3"
    - cron: "*/10 8-11 * * 3"
    # Nightly safety run, 2am SGT (18:00 UTC previous day).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coe-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest COE results
        run: python scripts/fetch_coe.py
      - name: Commit if changed
        run: |
          git config user.name "coetoday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json index.html
          if git diff --cached --quiet; then
            echo "No change - nothing to commit."
            exit 0
          fi
          git commit -m "COE data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
